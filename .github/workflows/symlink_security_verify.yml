name: Symlink Security Verify

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app.py'
      - 'tests/test_adversarial_paths.py'
      - '.github/workflows/symlink_security_verify.yml'

permissions:
  contents: read

jobs:
  symlink-verify:
    name: Ubuntu Symlink Security & Containment Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest werkzeug requests

      - name: Run focused symlink security tests (T1 - T7)
        run: |
          echo "=== Running T1 - T7 Symlink Security Regression Tests on Ubuntu ==="
          python -m pytest tests/test_adversarial_paths.py -v -k "test_symlink_t" --tb=short -rs

      - name: Verify zero symlink tests skipped on Ubuntu
        run: |
          echo "=== Verifying all 7 symlink tests executed and passed on Ubuntu ==="
          output=$(python -m pytest tests/test_adversarial_paths.py -k "test_symlink_t" -q)
          echo "$output"
          if echo "$output" | grep -i "skipped"; then
            echo "ERROR: Required symlink tests were skipped on Ubuntu! All symlink tests must execute."
            exit 1
          fi

      - name: Run full adversarial paths security suite
        run: |
          echo "=== Running full test_adversarial_paths.py security suite ==="
          python -m pytest tests/test_adversarial_paths.py -v --tb=short

      - name: Run broader core workflow & rollback test suites
        run: |
          echo "=== Running core integration, rollback, and reliability suites ==="
          python -m pytest tests/test_adversarial_rollback.py tests/test_workflow_integration.py tests/test_workflow_reliability.py tests/test_csrf_origin_policy.py tests/test_financial_accounting.py tests/test_security_http_filesystem.py tests/test_security_secrets.py -v --tb=short
